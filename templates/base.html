{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Correspondence Register{% endblock %}</title><link rel="icon" type="image/png" href="{% static 'img/dgc.png' %}"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fb}.navbar{background:#142b4a}.brand-logo{height:40px;background:#fff;border-radius:6px;padding:3px 8px}.card{border:0;box-shadow:0 2px 12px #142b4a0c}.table thead th{white-space:nowrap;color:#536174;font-size:.82rem}.muted{color:#718096}</style></head><body><nav class="navbar navbar-expand-lg navbar-dark"><div class="container-fluid px-4"><a class="navbar-brand d-flex align-items-center gap-2" href="/"><img class="brand-logo" src="{% static 'img/dgc.png' %}" alt="DGC logo"><span class="fs-6">Correspondence Register</span></a><div class="d-flex gap-3 align-items-center text-white">{% if user.is_authenticated %}<span>{{ user.get_username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Sign out</button></form>{% endif %}</div></div></nav><main class="container-fluid px-4 py-4">{% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
