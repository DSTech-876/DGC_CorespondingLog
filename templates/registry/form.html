{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>{{ title }}</h1>
    <p class="subtitle">Fields mirror the original correspondence register columns.</p>
  </div>
  <a class="btn btn-outline-secondary" href="{% url 'correspondence_list' %}"><i class="bi bi-arrow-left me-1"></i> Back to register</a>
</div>

<div class="card p-4">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form.html" with form=form wrapper_class="col-md-6" %}
    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i> Save correspondence</button>
      <a class="btn btn-outline-secondary" href="{% url 'correspondence_list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
