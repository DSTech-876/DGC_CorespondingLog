{% extends "auth_base.html" %}

{% block title %}Password updated{% endblock %}

{% block auth_content %}
  <div class="text-center">
    <i class="bi bi-check-circle text-success" style="font-size:2.4rem"></i>
    <h1 class="h5 mt-2 mb-1">Password updated</h1>
    <p class="muted small mb-4">Your password has been changed. You can now sign in with it.</p>
    <a class="btn btn-primary w-100" href="{% url 'login' %}">Sign in</a>
  </div>
{% endblock %}
